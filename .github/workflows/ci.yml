name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Tests
        run: python -m pytest -q
      # The demo pipeline needs no secrets: it never calls a brokerage, FX or news API.
      - name: Build the demo database and export
        env:
          PULSE_DB_PATH: ${{ runner.temp }}/pulse_demo.db
        run: |
          python -m portfolio_pulse demo
          python -m portfolio_pulse performance
          python -m portfolio_pulse export --out "${{ runner.temp }}/powerbi_demo"
      - name: Privacy gate (demo data only)
        run: python -m portfolio_pulse.demo_gate "${{ runner.temp }}/powerbi_demo"
      - name: SQL control totals for the Power BI reconciliation page
        run: python scripts/reconcile_powerbi.py --db "${{ runner.temp }}/pulse_demo.db" --out "${{ runner.temp }}/powerbi_demo"
